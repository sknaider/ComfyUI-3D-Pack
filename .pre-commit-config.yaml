# Pre-commit hooks configuration for ComfyUI-3D-Pack
# See https://pre-commit.com for more information

default_language_version:
  python: python3.10

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]  # Allow custom tags in YAML
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
      - id: mixed-line-ending

  # Python code formatting with Black
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        language_version: python3.10
        args: [--line-length=120]
        exclude: ^(Gen_3D_Modules/|MVs_Algorithms/|Checkpoints/|_Pre_Builds/)

  # Python import sorting with isort
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [--profile=black, --line-length=120]
        exclude: ^(Gen_3D_Modules/|MVs_Algorithms/|Checkpoints/|_Pre_Builds/)

  # Python linting and formatting with Ruff (fast!)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.9
    hooks:
      # Run the linter
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        exclude: ^(Gen_3D_Modules/|MVs_Algorithms/|Checkpoints/|_Pre_Builds/)
      # Run the formatter
      - id: ruff-format
        exclude: ^(Gen_3D_Modules/|MVs_Algorithms/|Checkpoints/|_Pre_Builds/)

  # Type checking with mypy
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        additional_dependencies: [types-all]
        args: [--ignore-missing-imports, --show-error-codes]
        exclude: ^(Gen_3D_Modules/|MVs_Algorithms/|Checkpoints/|_Pre_Builds/|tests/)

  # Security checks
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.6
    hooks:
      - id: bandit
        args: [-c, pyproject.toml, -r]
        additional_dependencies: ["bandit[toml]"]
        exclude: ^(tests/|Gen_3D_Modules/|MVs_Algorithms/)

  # Docstring coverage and style
  - repo: https://github.com/pycqa/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        args: [--convention=google]
        exclude: ^(tests/|Gen_3D_Modules/|MVs_Algorithms/|Checkpoints/|_Pre_Builds/)
        additional_dependencies: [toml]

  # Check for common spelling mistakes
  - repo: https://github.com/codespell-project/codespell
    rev: v2.2.6
    hooks:
      - id: codespell
        args: [--ignore-words-list=nd,te,ot]
        exclude: ^(Gen_3D_Modules/|MVs_Algorithms/|Checkpoints/|example_workflows/)

# Helm Values for US East 1 (N. Virginia) Region
# AWS Region: us-east-1
# GCP Region: us-east1
# Azure Region: eastus

# Global overrides for US East region
global:
  region: us-east-1
  storageClass: gp3-encrypted

# Replica configuration for US market
replicaCount: 5

image:
  registry: docker.io
  repository: comfyui-3d-pack
  tag: "0.1.7"
  pullPolicy: IfNotPresent

# Update strategy for zero-downtime deployments
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 2
    maxUnavailable: 0

# US East specific configuration
config:
  region: us-east-1
  logLevel: INFO
  logFormat: json
  enableAuth: true
  maxWorkers: 6
  gpuMemoryFraction: 0.9
  requestTimeout: 3600

# Service configuration
service:
  type: ClusterIP
  port: 8188
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
  sessionAffinity: ClientIP

# Ingress with AWS ALB
ingress:
  enabled: true
  ingressClassName: alb
  hostname: api-us-east.comfyui.com
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/success-codes: "200"
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:ACCOUNT_ID:certificate/CERT_ID
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS-1-2-2017-01
  tls: true

# Resource allocation for US East (higher traffic)
resources:
  limits:
    memory: 24Gi
    cpu: 6000m
    nvidia.com/gpu: "1"
  requests:
    memory: 16Gi
    cpu: 4000m
    nvidia.com/gpu: "1"

# Autoscaling for US peak hours
autoscaling:
  enabled: true
  minReplicas: 5
  maxReplicas: 20
  targetCPU: 70
  targetMemory: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 4
          periodSeconds: 30
      selectPolicy: Max

# Persistence with regional storage
persistence:
  models:
    enabled: true
    storageClass: gp3-encrypted
    accessMode: ReadOnlyMany
    size: 200Gi
    annotations:
      volume.beta.kubernetes.io/storage-class: gp3-encrypted
  output:
    enabled: true
    storageClass: gp3-encrypted
    accessMode: ReadWriteMany
    size: 100Gi

# Object Storage - S3 in US East 1
objectStorage:
  enabled: true
  type: s3
  endpoint: s3.us-east-1.amazonaws.com
  bucket: comfyui-3d-pack-us-east-1
  region: us-east-1
  # Credentials should be provided via secrets or IRSA

# Redis for caching and rate limiting
redis:
  enabled: true
  architecture: replicaset
  auth:
    enabled: true
  replica:
    replicaCount: 3
  persistence:
    size: 10Gi
    storageClass: gp3-encrypted

# PostgreSQL for metadata
postgresql:
  enabled: true
  auth:
    username: comfyui
    database: comfyui
  primary:
    persistence:
      size: 50Gi
      storageClass: gp3-encrypted
  replication:
    enabled: true
    readReplicas: 2

# Metrics and monitoring
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s
    namespace: monitoring

# Pod topology spread for high availability
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: comfyui-3d-pack
  - maxSkew: 2
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: comfyui-3d-pack

# Node affinity for GPU nodes
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node.kubernetes.io/instance-type
              operator: In
              values:
                - g4dn.xlarge
                - g4dn.2xlarge
                - g5.xlarge
                - g5.2xlarge
            - key: topology.kubernetes.io/zone
              operator: In
              values:
                - us-east-1a
                - us-east-1b
                - us-east-1c

# Pod Disruption Budget for high availability
podDisruptionBudget:
  enabled: true
  minAvailable: 3

# Security context
podSecurityContext:
  enabled: true
  fsGroup: 1001
  runAsNonRoot: true

containerSecurityContext:
  enabled: true
  runAsUser: 1001
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  allowPrivilegeEscalation: false

# Service account with IRSA for AWS
serviceAccount:
  create: true
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/comfyui-3d-pack-us-east-1
  automountServiceAccountToken: true

# Network policies
networkPolicy:
  enabled: true
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8188
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 53  # DNS
        - protocol: UDP
          port: 53  # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              name: kube-system
      ports:
        - protocol: TCP
          port: 443  # API server

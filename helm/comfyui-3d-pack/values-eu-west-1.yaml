# Helm Values for EU West 1 (Ireland) Region
# AWS Region: eu-west-1
# GCP Region: europe-west1
# Azure Region: westeurope

# Global overrides for EU West region
global:
  region: eu-west-1
  storageClass: gp3-encrypted

# Replica configuration for EU market
replicaCount: 4

image:
  registry: docker.io
  repository: comfyui-3d-pack
  tag: "0.1.7"
  pullPolicy: IfNotPresent

# Update strategy
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 2
    maxUnavailable: 0

# EU West specific configuration
config:
  region: eu-west-1
  logLevel: INFO
  logFormat: json
  enableAuth: true
  maxWorkers: 6
  gpuMemoryFraction: 0.9
  requestTimeout: 3600

# Service configuration
service:
  type: ClusterIP
  port: 8188
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
  sessionAffinity: ClientIP

# Ingress with AWS ALB for EU
ingress:
  enabled: true
  ingressClassName: alb
  hostname: api-eu.comfyui.com
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:eu-west-1:ACCOUNT_ID:certificate/CERT_ID
    # GDPR compliance headers
    alb.ingress.kubernetes.io/actions.ssl-redirect: '{"Type": "redirect", "RedirectConfig": { "Protocol": "HTTPS", "Port": "443", "StatusCode": "HTTP_301"}}'
  tls: true

# Resource allocation for EU region
resources:
  limits:
    memory: 24Gi
    cpu: 6000m
    nvidia.com/gpu: "1"
  requests:
    memory: 16Gi
    cpu: 4000m
    nvidia.com/gpu: "1"

# Autoscaling for EU business hours
autoscaling:
  enabled: true
  minReplicas: 4
  maxReplicas: 15
  targetCPU: 70
  targetMemory: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 60

# Persistence with EU data residency
persistence:
  models:
    enabled: true
    storageClass: gp3-encrypted
    accessMode: ReadOnlyMany
    size: 200Gi
    annotations:
      volume.beta.kubernetes.io/storage-class: gp3-encrypted
      # EU data residency label
      data-residency: eu
  output:
    enabled: true
    storageClass: gp3-encrypted
    accessMode: ReadWriteMany
    size: 100Gi
    annotations:
      data-residency: eu

# Object Storage - S3 in EU West 1 (GDPR compliant)
objectStorage:
  enabled: true
  type: s3
  endpoint: s3.eu-west-1.amazonaws.com
  bucket: comfyui-3d-pack-eu-west-1
  region: eu-west-1
  # Enable encryption for GDPR compliance
  extraConfig:
    server_side_encryption: AES256

# Redis with encryption at rest
redis:
  enabled: true
  architecture: replicaset
  auth:
    enabled: true
  replica:
    replicaCount: 3
  persistence:
    size: 10Gi
    storageClass: gp3-encrypted
  # Enable transit encryption
  tls:
    enabled: true

# PostgreSQL with encryption
postgresql:
  enabled: true
  auth:
    username: comfyui
    database: comfyui
  primary:
    persistence:
      size: 50Gi
      storageClass: gp3-encrypted
  replication:
    enabled: true
    readReplicas: 2
  # Enable SSL for connections
  tls:
    enabled: true

# Metrics and monitoring
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s
    namespace: monitoring

# Pod topology spread across EU zones
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: comfyui-3d-pack

# Node affinity for EU GPU nodes
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: topology.kubernetes.io/zone
              operator: In
              values:
                - eu-west-1a
                - eu-west-1b
                - eu-west-1c

# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 2

# Security - GDPR compliant
podSecurityContext:
  enabled: true
  fsGroup: 1001
  runAsNonRoot: true

containerSecurityContext:
  enabled: true
  runAsUser: 1001
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  allowPrivilegeEscalation: false

# Service account with IRSA
serviceAccount:
  create: true
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/comfyui-3d-pack-eu-west-1
    # GDPR compliance annotation
    data-residency: eu

# Network policies for GDPR
networkPolicy:
  enabled: true
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8188
  egress:
    # Restrict egress to EU endpoints only for GDPR
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53

# Additional labels for GDPR compliance
commonLabels:
  data-residency: eu
  compliance: gdpr
  environment: production

# GDPR-specific annotations
commonAnnotations:
  gdpr-compliant: "true"
  data-location: eu-west-1
  encryption-at-rest: "true"
  encryption-in-transit: "true"

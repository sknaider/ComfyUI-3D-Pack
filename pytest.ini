[pytest]
# pytest configuration for ComfyUI-3D-Pack

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Minimum version
minversion = 7.0

# Output options
addopts =
    # Verbose output
    -v
    # Show local variables in tracebacks
    -l
    # Show summary of all test outcomes
    -ra
    # Enable strict markers
    --strict-markers
    # Coverage options
    --cov=.
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    # Ignore certain patterns
    --ignore=Gen_3D_Modules
    --ignore=MVs_Algorithms
    --ignore=Checkpoints
    --ignore=_Pre_Builds
    --ignore=example_workflows
    # Async support
    --asyncio-mode=auto

# Markers for test categorization
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, may require dependencies)
    security: Security-related tests
    slow: Tests that take a long time to run
    requires_gpu: Tests that require GPU
    requires_models: Tests that require downloaded models

# Ignore warnings from dependencies
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::FutureWarning

# Coverage options
[coverage:run]
source = .
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */Gen_3D_Modules/*
    */MVs_Algorithms/*
    */Checkpoints/*
    */_Pre_Builds/*
    */example_workflows/*
    setup.py
    */site-packages/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

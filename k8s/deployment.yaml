apiVersion: apps/v1
kind: Deployment
metadata:
  name: comfyui-3d-pack
  namespace: comfyui-3d-pack
  labels:
    app: comfyui-3d-pack
    version: v0.1.7
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: comfyui-3d-pack
  template:
    metadata:
      labels:
        app: comfyui-3d-pack
        version: v0.1.7
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8188"
        prometheus.io/path: "/metrics"
    spec:
      # Security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001

      # Init container for model download
      initContainers:
      - name: model-downloader
        image: busybox:latest
        command: ['sh', '-c', 'echo "Models should be pre-downloaded or use persistent volume"']
        volumeMounts:
        - name: models
          mountPath: /models

      containers:
      - name: comfyui-3d-pack
        image: comfyui-3d-pack:v0.1.7
        imagePullPolicy: IfNotPresent

        ports:
        - name: http
          containerPort: 8188
          protocol: TCP

        # Environment variables
        env:
        - name: LOG_FORMAT
          value: "json"
        - name: LOG_LEVEL
          value: "INFO"
        - name: ENABLE_AUTH
          value: "true"
        - name: HUGGINGFACE_TOKEN
          valueFrom:
            secretKeyRef:
              name: comfyui-secrets
              key: huggingface-token
        - name: API_KEYS
          valueFrom:
            secretKeyRef:
              name: comfyui-secrets
              key: api-keys

        # Resource limits
        resources:
          requests:
            memory: "8Gi"
            cpu: "2000m"
            nvidia.com/gpu: "1"
          limits:
            memory: "16Gi"
            cpu: "4000m"
            nvidia.com/gpu: "1"

        # Probes
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        # Startup probe for slow-starting containers
        startupProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30

        # Volume mounts
        volumeMounts:
        - name: models
          mountPath: /app/models
        - name: output
          mountPath: /app/output
        - name: logs
          mountPath: /app/logs
        - name: tmp
          mountPath: /tmp

        # Security context (container level)
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false  # Set to true if possible
          capabilities:
            drop:
            - ALL

      # Volumes
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: comfyui-models-pvc
      - name: output
        persistentVolumeClaim:
          claimName: comfyui-output-pvc
      - name: logs
        emptyDir: {}
      - name: tmp
        emptyDir: {}

      # Node selector for GPU nodes
      nodeSelector:
        nvidia.com/gpu.present: "true"

      # Tolerations for GPU nodes
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule

      # Affinity rules
      affinity:
        # Prefer spreading across nodes
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - comfyui-3d-pack
              topologyKey: kubernetes.io/hostname

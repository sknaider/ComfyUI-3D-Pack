---
apiVersion: networking.istio.io/v1beta1
kind: ServiceEntry
metadata:
  name: minio
  namespace: production
spec:
  hosts:
  - "minio.local"
  - "*.minio.local"
  addresses:
  - 10.0.0.0/8  # Adjust based on your network
  ports:
  - number: 9000
    name: http
    protocol: HTTP
  - number: 9001
    name: console
    protocol: HTTP
  location: MESH_EXTERNAL
  resolution: DNS


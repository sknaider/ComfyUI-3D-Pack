---
# External database (if using external RDS/Cloud SQL)
apiVersion: networking.istio.io/v1beta1
kind: ServiceEntry
metadata:
  name: external-postgres
  namespace: production
spec:
  hosts:
  - "postgres.example.com"  # Replace with actual endpoint
  addresses:
  - 10.0.0.0/8  # Adjust to your VPC CIDR
  ports:
  - number: 5432
    name: postgres
    protocol: TCP
  location: MESH_EXTERNAL
  resolution: DNS

---
# External Redis (if using external ElastiCache/Memorystore)
apiVersion: networking.istio.io/v1beta1
kind: ServiceEntry
metadata:
  name: external-redis
  namespace: production
spec:
  hosts:
  - "redis.example.com"  # Replace with actual endpoint
  addresses:
  - 10.0.0.0/8
  ports:
  - number: 6379
    name: redis
    protocol: TCP
  location: MESH_EXTERNAL
  resolution: DNS

---
# Jaeger collector for tracing
apiVersion: networking.istio.io/v1beta1
kind: ServiceEntry
metadata:
  name: jaeger-collector
  namespace: production
spec:
  hosts:
  - "jaeger-collector.tracing.svc.cluster.local"
  ports:
  - number: 9411
    name: http-zipkin
    protocol: HTTP
  - number: 14268
    name: http-jaeger
    protocol: HTTP
  location: MESH_INTERNAL
  resolution: DNS
  exportTo:
  - "*"
